# Broker del taller. Se arranca como usuario, sin systemd:
#   mosquitto -c iot/mosquitto/mosquitto.conf -d
listener 1883 0.0.0.0

# ATENCION: allow_anonymous true SOLO para el taller en red local.
# Cualquiera en la misma WiFi puede publicar y leer. No exponer a internet.
allow_anonymous true

pid_file /tmp/mosquitto-taller.pid
