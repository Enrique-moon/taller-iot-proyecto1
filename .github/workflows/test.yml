name: test
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: iot, POSTGRES_PASSWORD: iot, POSTGRES_DB: iot}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U iot" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://iot:iot@localhost:5432/iot
      PGSSLMODE: disable   # el Postgres del CI no tiene SSL
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: psql "$DATABASE_URL" -f schema.sql
      - run: pip install -r dashboard/requirements.txt -r captura/requirements.txt pytest httpx
      - run: cd dashboard && pytest -q
      - run: cd captura && pytest -q
