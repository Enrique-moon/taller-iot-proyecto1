# Solo PostgreSQL de práctica. El broker y la app corren fuera de Docker.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_DB: iot
    ports:
      - "55433:5432"   # 55433 en el host para no chocar con otro Postgres en 55432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
